<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061326"/><stop offset=".55" stop-color="#09294B"/><stop offset="1" stop-color="#07162B"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#137DFF"/><stop offset="1" stop-color="#00C6E8"/></linearGradient>
 <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF4D1C"/><stop offset="1" stop-color="#FFB11B"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12385B"/><stop offset="1" stop-color="#0A203A"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.h{font:700 36px Inter,Arial,sans-serif;fill:#F4F8FF}.sub{font:400 18px Inter,Arial,sans-serif;fill:#AFC6E4}.title{font:700 22px Inter,Arial,sans-serif;fill:#F4F8FF}.body{font:400 15px Inter,Arial,sans-serif;fill:#B9CBE1}.tiny{font:600 12px Inter,Arial,sans-serif;fill:#B9CBE1}.brand{font:800 26px Inter,Arial,sans-serif;fill:#F7FBFF}.btn{font:700 14px Inter,Arial,sans-serif;fill:#FFFFFF}.label{font:600 14px Inter,Arial,sans-serif;fill:#DDEBFC}.card{fill:url(#glass);stroke:#214A72;stroke-width:2}.line{stroke:#244D73;stroke-width:1.5}.field{fill:#07182B;stroke:#2A5279;stroke-width:1.5}.muted{fill:#102A47}.orange{fill:#FF6B22}.blue{fill:#1688FF}.cyan{fill:#00C7E8}.green{fill:#2BC48A}</style>
</defs>
<rect width="2400" height="1800" fill="url(#bg)"/>
<circle cx="2100" cy="110" r="240" fill="#087BFF" opacity=".10" filter="url(#glow)"/><circle cx="130" cy="1630" r="280" fill="#00C6E8" opacity=".07" filter="url(#glow)"/>
<!-- header -->
<text x="70" y="70" class="brand">✦ DHARM</text><text x="70" y="108" class="sub">Give surplus food a purpose.</text><text x="760" y="68" class="h">Frontend Wireframe Board</text><text x="760" y="105" class="sub">Fiery blue magic • warm orange energy • community first</text>
<g transform="translate(1690 42)"><rect width="120" height="38" rx="19" fill="#07182B" stroke="#244D73"/><circle cx="20" cy="19" r="8" fill="#061326" stroke="#1688FF"/><text x="38" y="24" class="tiny">#061326</text><rect x="135" width="120" height="38" rx="19" fill="#1688FF"/><text x="173" y="24" class="tiny">#1688FF</text><rect x="270" width="120" height="38" rx="19" fill="#00C7E8"/><text x="304" y="24" class="tiny" fill="#061326">#00C7E8</text><rect x="405" width="120" height="38" rx="19" fill="url(#fire)"/><text x="441" y="24" class="tiny">#FF6B22</text></g>
<!-- card 1 homepage -->
<g transform="translate(60 160)"><rect width="720" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">01 / LANDING PAGE</text><rect x="20" y="55" width="680" height="54" rx="12" fill="#07182B" stroke="#234B71"/><text x="38" y="89" class="brand">✦ Dharm</text><text x="300" y="87" class="tiny">How it works</text><text x="410" y="87" class="tiny">Impact</text><rect x="526" y="67" width="70" height="30" rx="9" fill="#102A47"/><text x="544" y="87" class="tiny">Login</text><rect x="605" y="67" width="80" height="30" rx="9" fill="url(#fire)"/><text x="621" y="87" class="tiny">Sign up</text><text x="38" y="180" class="h">Good food deserves</text><text x="38" y="224" class="h">another <tspan fill="#FF9A25">chance.</tspan></text><text x="38" y="260" class="body">Connect surplus food with communities</text><text x="38" y="284" class="body">that can collect and share it safely.</text><rect x="38" y="310" width="150" height="46" rx="12" fill="url(#fire)"/><text x="65" y="339" class="btn">Get started →</text><rect x="202" y="310" width="130" height="46" rx="12" fill="#0A203A" stroke="#2A5279"/><text x="226" y="339" class="label">How it works</text><circle cx="550" cy="240" r="112" fill="url(#blue)" opacity=".18" filter="url(#glow)"/><circle cx="550" cy="240" r="88" fill="#102F4C" stroke="#1688FF" stroke-width="2"/><text x="490" y="230" font-size="54">🥗</text><text x="480" y="270" class="tiny">Food rescued</text><rect x="25" y="390" width="670" height="78" rx="14" fill="#0A203A" stroke="#214A72"/><text x="52" y="422" class="title" fill="#FF9A25">♧</text><text x="82" y="420" class="label">Reduce food waste</text><text x="82" y="444" class="tiny">Give surplus meals a second life</text><text x="290" y="422" class="title" fill="#00C7E8">◎</text><text x="320" y="420" class="label">Help communities</text><text x="320" y="444" class="tiny">Connect locally and quickly</text><text x="525" y="422" class="title" fill="#2BC48A">♡</text><text x="555" y="420" class="label">Track impact</text><text x="555" y="444" class="tiny">Celebrate completed rescues</text></g>
<!-- card 2 role selection -->
<g transform="translate(810 160)"><rect width="480" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">02 / ROLE SELECTION</text><text x="35" y="100" class="h">Welcome to Dharm</text><text x="35" y="130" class="body">How would you like to make a difference?</text><rect x="28" y="160" width="205" height="220" rx="18" fill="#0A203A" stroke="#1688FF" stroke-width="2"/><circle cx="130" cy="220" r="40" fill="#1688FF" opacity=".18"/><text x="105" y="234" font-size="42">🍲</text><text x="55" y="286" class="title">Donate food</text><text x="48" y="316" class="body">List surplus food</text><text x="48" y="340" class="body">Help nearby communities</text><rect x="248" y="160" width="205" height="220" rx="18" fill="#0A203A" stroke="#FF6B22" stroke-width="2"/><circle cx="350" cy="220" r="40" fill="#FF6B22" opacity=".18"/><text x="325" y="234" font-size="42">🤝</text><text x="272" y="286" class="title">Receive food</text><text x="270" y="316" class="body">Find available food</text><text x="270" y="340" class="body">Arrange collection</text><rect x="28" y="410" width="425" height="48" rx="12" fill="url(#fire)"/><text x="180" y="440" class="btn">Continue →</text></g>
<!-- card 3 login -->
<g transform="translate(1320 160)"><rect width="480" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">03 / LOGIN & SIGNUP</text><text x="38" y="100" class="h">Welcome back</text><text x="38" y="130" class="body">Sign in to continue your food rescue journey.</text><text x="38" y="177" class="label">Email address</text><rect x="38" y="190" width="400" height="44" rx="9" class="field"/><text x="53" y="218" class="body">you@example.com</text><text x="38" y="264" class="label">Password</text><rect x="38" y="277" width="400" height="44" rx="9" class="field"/><text x="53" y="305" class="body">••••••••••••</text><rect x="38" y="342" width="400" height="48" rx="11" fill="url(#fire)"/><text x="195" y="372" class="btn">Sign in →</text><text x="82" y="425" class="body">New to Dharm?</text><text x="220" y="425" class="label" fill="#00C7E8">Create account</text><text x="38" y="460" class="tiny">Authentication is required for protected actions only.</text></g>
<!-- card 4 dashboard -->
<g transform="translate(1830 160)"><rect width="510" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">04 / SHARED DASHBOARD</text><text x="28" y="85" class="brand">✦ Dharm</text><circle cx="450" cy="75" r="17" fill="#153C60"/><text x="442" y="81" class="tiny">S</text><text x="28" y="130" class="h">Good morning!</text><text x="28" y="156" class="body">Small actions create meaningful change.</text><g transform="translate(25 180)"><rect width="140" height="75" rx="12" fill="#0A203A" stroke="#214A72"/><text x="18" y="31" class="title" fill="#00C7E8">12</text><text x="18" y="55" class="tiny">Donations</text><rect x="155" width="140" height="75" rx="12" fill="#0A203A" stroke="#214A72"/><text x="173" y="31" class="title" fill="#FF9A25">8</text><text x="173" y="55" class="tiny">People helped</text><rect x="310" width="140" height="75" rx="12" fill="#0A203A" stroke="#214A72"/><text x="328" y="31" class="title" fill="#2BC48A">24 kg</text><text x="328" y="55" class="tiny">Food rescued</text></g><rect x="25" y="275" width="220" height="110" rx="15" fill="url(#blue)" opacity=".95"/><text x="43" y="310" class="title">Donate food</text><text x="43" y="337" class="body">Share surplus meals</text><text x="43" y="360" class="label">Create listing →</text><rect x="260" y="275" width="220" height="110" rx="15" fill="#103F45" stroke="#2BC48A"/><text x="278" y="310" class="title">Find food</text><text x="278" y="337" class="body">Explore nearby offers</text><text x="278" y="360" class="label">Browse map →</text><text x="28" y="425" class="title">Recent activity</text><text x="28" y="454" class="body">Donation listed · Veg meals</text><text x="28" y="476" class="body">Collection confirmed · Hope NGO</text></g>
