<!-- donation form -->
<g transform="translate(60 690)"><rect width="720" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">05 / CREATE DONATION</text><text x="28" y="82" class="h">Share surplus food</text><text x="28" y="110" class="body">Tell nearby organizations what is available.</text><text x="28" y="151" class="label">Donation title</text><rect x="28" y="163" width="664" height="38" rx="8" class="field"/><text x="42" y="187" class="body">e.g. Fresh vegetarian meals</text><text x="28" y="230" class="label">Food category</text><rect x="28" y="242" width="315" height="38" rx="8" class="field"/><text x="42" y="266" class="body">Cooked food ▾</text><text x="370" y="230" class="label">Quantity and unit</text><rect x="370" y="242" width="150" height="38" rx="8" class="field"/><text x="384" y="266" class="body">40</text><rect x="532" y="242" width="160" height="38" rx="8" class="field"/><text x="545" y="266" class="body">Meals ▾</text><text x="28" y="310" class="label">Pickup deadline</text><rect x="28" y="322" width="315" height="38" rx="8" class="field"/><text x="42" y="346" class="body">Choose date and time</text><text x="370" y="310" class="label">Storage conditions</text><rect x="370" y="322" width="322" height="38" rx="8" class="field"/><text x="384" y="346" class="body">Select storage ▾</text><text x="28" y="390" class="label">Pickup location</text><rect x="28" y="402" width="664" height="38" rx="8" class="field"/><text x="42" y="426" class="body">Search address or choose map pin</text><rect x="28" y="451" width="664" height="28" rx="9" fill="url(#fire)"/><text x="276" y="470" class="btn">Publish donation →</text></g>
