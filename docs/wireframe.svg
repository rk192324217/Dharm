<g transform="translate(810 690)"><rect width="480" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">06 / RECEIVE DASHBOARD</text><text x="26" y="82" class="h">Food near you</text><rect x="26" y="101" width="428" height="40" rx="9" class="field"/><text x="42" y="126" class="body">Search food, category or location</text><rect x="26" y="154" width="72" height="28" rx="14" fill="#1688FF"/><text x="46" y="173" class="tiny">All</text><rect x="107" y="154" width="110" height="28" rx="14" fill="#102A47" stroke="#244D73"/><text x="122" y="173" class="tiny">Cooked food</text><rect x="226" y="154" width="92" height="28" rx="14" fill="#102A47" stroke="#244D73"/><text x="243" y="173" class="tiny">Bakery</text><g transform="translate(26 198)"><rect width="428" height="84" rx="12" fill="#0A203A" stroke="#214A72"/><rect x="10" y="10" width="78" height="64" rx="8" fill="#123B58"/><text x="25" y="48" font-size="28">🍛</text><text x="102" y="28" class="label">Fresh vegetarian meals</text><text x="102" y="49" class="body">20 portions · 1.2 km away</text><text x="102" y="68" class="tiny">Collect before 8:30 PM</text><rect x="342" y="28" width="74" height="32" rx="8" fill="url(#fire)"/><text x="355" y="49" class="tiny">Request</text><rect y="96" width="428" height="84" rx="12" fill="#0A203A" stroke="#214A72"/><rect x="10" y="106" width="78" height="64" rx="8" fill="#123B58"/><text x="25" y="145" font-size="28">🍞</text><text x="102" y="124" class="label">Fresh bakery items</text><text x="102" y="145" class="body">12 packs · 2.4 km away</text><text x="102" y="164" class="tiny">Collect before 9:00 PM</text><rect x="342" y="124" width="74" height="32" rx="8" fill="url(#fire)"/><text x="355" y="145" class="tiny">Request</text><rect y="192" width="428" height="84" rx="12" fill="#0A203A" stroke="#214A72"/><rect x="10" y="202" width="78" height="64" rx="8" fill="#123B58"/><text x="25" y="241" font-size="28">🍎</text><text x="102" y="220" class="label">Mixed fresh fruit</text><text x="102" y="241" class="body">8 kg · 3.1 km away</text><text x="102" y="260" class="tiny">Collect before 9:15 PM</text><rect x="342" y="220" width="74" height="32" rx="8" fill="url(#fire)"/><text x="355" y="241" class="tiny">Request</text></g></g>
<!-- map -->
<g transform="translate(1320 690)"><rect width="480" height="490" rx="22" class="card"/><text x="26" y="38" class="tiny">07 / NEARBY MAP</text><text x="26" y="82" class="h">Rescue around you</text><rect x="25" y="100" width="430" height="350" rx="14" fill="#0A2844" stroke="#244D73"/><path d="M45 170 L430 390 M60 370 L420 160 M160 115 L270 440 M355 115 L120 430 M35 270 L450 270" stroke="#1C5275" stroke-width="9" fill="none"/><path d="M45 220 L430 220 M45 320 L430 320 M200 105 L200 445" stroke="#2C6B8A" stroke-width="3" fill="none" opacity=".7"/><g fill="#1688FF" stroke="#D9F8FF" stroke-width="2"><circle cx="130" cy="210" r="13"/><circle cx="325" cy="295" r="13"/></g><g fill="#FF6B22" stroke="#FFF1DA" stroke-width="2"><circle cx="270" cy="180" r="13"/></g><g fill="#2BC48A" stroke="#DFFFF1" stroke-width="2"><circle cx="155" cy="365" r="13"/></g><rect x="25" y="402" width="430" height="48" rx="10" fill="#07182B" stroke="#244D73"/><text x="42" y="431" class="body">4 available donations · Filter by distance</text><text x="26" y="475" class="tiny">Use approximate public markers until a request is accepted.</text></g>
<!-- requests -->
