<text x="30" y="310" class="title">Components</text><g transform="translate(30 330)"><rect width="180" height="48" rx="12" fill="url(#fire)"/><text x="36" y="30" class="btn">Primary action →</text><rect x="200" width="180" height="48" rx="12" fill="#0A203A" stroke="#1688FF"/><text x="237" y="30" class="label">Secondary action</text><rect x="400" width="250" height="48" rx="12" class="field"/><text x="418" y="30" class="body">Input field</text><rect x="670" width="170" height="48" rx="24" fill="#103F45" stroke="#2BC48A"/><text x="699" y="30" class="label">✓ Verified</text><rect x="860" width="180" height="48" rx="12" fill="#102A47" stroke="#244D73"/><text x="882" y="30" class="label">Food card</text><rect x="1060" width="220" height="48" rx="12" fill="#0A203A" stroke="#214A72"/><text x="1080" y="30" class="label">Glass surface</text></g>
<text x="30" y="430" class="title">Responsive rules</text><text x="30" y="460" class="body">Desktop: sidebar + content grid. Tablet: collapsible sidebar and two columns. Mobile: single column, sticky primary action, bottom navigation, accessible tap targets.</text><text x="30" y="485" class="tiny">Import this SVG into Figma as a visual wireframe reference. Rebuild components as native Figma components for production design handoff.</text></g>
